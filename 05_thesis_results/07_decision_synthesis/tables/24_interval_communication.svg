<text xml:space="preserve" text-anchor="start" x="9" y="-103" font-family="Cambria" font-size="9.00" fill="#5a5a5a">Note. Scenarios are abbreviated to their letter: A = A_llm_plain; B = B_llm_data; C = C_llm_model; D = D_prometheus_data; E = E_prometheus_model; F =</text>
<text xml:space="preserve" text-anchor="start" x="9" y="-89.75" font-family="Cambria" font-size="9.00" fill="#5a5a5a">F_llm_data_model; G = G_prometheus_data_model. Each criterion is scored by comparing the numbers in the answer against the numbers the tool returned, within</text>
<text xml:space="preserve" text-anchor="start" x="9" y="-76.5" font-family="Cambria" font-size="9.00" fill="#5a5a5a">five per cent; no judgement is involved. A scenario with no tool access cannot satisfy the second criterion, which requires a retrieved source to check a stated</text>
<text xml:space="preserve" text-anchor="start" x="9" y="-63.25" font-family="Cambria" font-size="9.00" fill="#5a5a5a">range against &#45;&#45; that is a finding, not a scoring artefact. These measures record what was communicated, not whether it improved a human decision.</text>
