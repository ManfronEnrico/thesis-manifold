<text xml:space="preserve" text-anchor="start" x="9" y="-116.25" font-family="Cambria" font-size="9.00" fill="#5a5a5a">Note. Each criterion is scored by comparing the numbers in the answer against the numbers the</text>
<text xml:space="preserve" text-anchor="start" x="9" y="-103" font-family="Cambria" font-size="9.00" fill="#5a5a5a">tool returned, within five per cent; no judgement is involved. A scenario with no tool access</text>
<text xml:space="preserve" text-anchor="start" x="9" y="-89.75" font-family="Cambria" font-size="9.00" fill="#5a5a5a">cannot satisfy the second criterion, which requires a retrieved source to check a stated range</text>
<text xml:space="preserve" text-anchor="start" x="9" y="-76.5" font-family="Cambria" font-size="9.00" fill="#5a5a5a">against &#45;&#45; that is a finding, not a scoring artefact. These measures record what was</text>
<text xml:space="preserve" text-anchor="start" x="9" y="-63.25" font-family="Cambria" font-size="9.00" fill="#5a5a5a">communicated, not whether it improved a human decision.</text>
