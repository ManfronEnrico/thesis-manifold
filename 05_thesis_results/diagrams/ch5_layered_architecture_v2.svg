<title>layered_architecture</title>
<text xml:space="preserve" text-anchor="middle" x="453.85" y="-47.95" font-family="Helvetica,sans-Serif" font-size="9.00" fill="#5a5a5a">The predictive extension in three layers. Candidate models are benchmarked on identical data and one is deployed per</text>
<text xml:space="preserve" text-anchor="middle" x="453.85" y="-37.45" font-family="Helvetica,sans-Serif" font-size="9.00" fill="#5a5a5a">product category; the tool interface exposes its forecasts with uncertainty and provenance attached; and only the</text>
<text xml:space="preserve" text-anchor="middle" x="453.85" y="-26.95" font-family="Helvetica,sans-Serif" font-size="9.00" fill="#5a5a5a">third evaluation scenario draws on that interface. The language model is reached over an API rather than hosted</text>
<text xml:space="preserve" text-anchor="middle" x="453.85" y="-16.45" font-family="Helvetica,sans-Serif" font-size="9.00" fill="#5a5a5a">locally, so the deployment envelope of 4 GB is spent on data and models alone — the most demanding model observed</text>
<text xml:space="preserve" text-anchor="middle" x="453.85" y="-5.95" font-family="Helvetica,sans-Serif" font-size="9.00" fill="#5a5a5a">requires 38 MB to fit.</text>
