<g id="graph0" class="graph" transform="scale(1 1) rotate(0) translate(4 415.95)">
<title>modelling</title>
<text xml:space="preserve" text-anchor="middle" x="542.47" y="-47.95" font-family="Helvetica,sans-Serif" font-size="9.00" fill="#5a5a5a">Model selection. Each candidate is fitted independently on the same data, under two training arms — one model per</text>
<text xml:space="preserve" text-anchor="middle" x="542.47" y="-37.45" font-family="Helvetica,sans-Serif" font-size="9.00" fill="#5a5a5a">product category, and a single pooled model with category as a feature — and is evaluated against statistical</text>
<text xml:space="preserve" text-anchor="middle" x="542.47" y="-26.95" font-family="Helvetica,sans-Serif" font-size="9.00" fill="#5a5a5a">baselines on held&#45;out months. Neither training arm dominates: category&#45;specific training achieves the lower error in 2</text>
<text xml:space="preserve" text-anchor="middle" x="542.47" y="-16.45" font-family="Helvetica,sans-Serif" font-size="9.00" fill="#5a5a5a">of 4 categories and pooled training in the remainder, so the choice is made per category rather than in general. The</text>
<text xml:space="preserve" text-anchor="middle" x="542.47" y="-5.95" font-family="Helvetica,sans-Serif" font-size="9.00" fill="#5a5a5a">model with the lowest error in each category is retrained on the full training window and deployed.</text>
