<title>eda_pipeline</title>
<text xml:space="preserve" text-anchor="start" x="8" y="-58.45" font-family="Helvetica,sans-Serif" font-size="9.00" fill="#5a5a5a">Exploratory analysis of a single product category, shown as the worked example; every category is analysed</text>
<text xml:space="preserve" text-anchor="start" x="8" y="-47.95" font-family="Helvetica,sans-Serif" font-size="9.00" fill="#5a5a5a">identically. The panel is examined along four lines of enquiry — its structure and quality, the coverage and retention</text>
<text xml:space="preserve" text-anchor="start" x="8" y="-37.45" font-family="Helvetica,sans-Serif" font-size="9.00" fill="#5a5a5a">of individual brands, its stationarity and seasonality, and the candidate demand drivers together with their</text>
<text xml:space="preserve" text-anchor="start" x="8" y="-26.95" font-family="Helvetica,sans-Serif" font-size="9.00" fill="#5a5a5a">redundancy. The findings are documented as tables and figures, and are what the subsequent data contract is measured</text>
<text xml:space="preserve" text-anchor="start" x="8" y="-16.45" font-family="Helvetica,sans-Serif" font-size="9.00" fill="#5a5a5a">from, so that decisions about lag depth, series length and transformation follow from the data rather than from</text>
<text xml:space="preserve" text-anchor="start" x="8" y="-5.95" font-family="Helvetica,sans-Serif" font-size="9.00" fill="#5a5a5a">convention.</text>
