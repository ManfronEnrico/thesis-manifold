<g id="graph0" class="graph" transform="scale(1 1) rotate(0) translate(4 315.4)">
<title>tool_interface</title>
<text xml:space="preserve" text-anchor="start" x="8" y="-47.95" font-family="Helvetica,sans-Serif" font-size="9.00" fill="#5a5a5a">The structured forecast interface. The agent supplies only an identifier and a horizon; feature construction remains</text>
<text xml:space="preserve" text-anchor="start" x="8" y="-37.45" font-family="Helvetica,sans-Serif" font-size="9.00" fill="#5a5a5a">on the server, so the language model never handles feature vectors. What returns is not a bare number but a forecast</text>
<text xml:space="preserve" text-anchor="start" x="8" y="-26.95" font-family="Helvetica,sans-Serif" font-size="9.00" fill="#5a5a5a">carrying its uncertainty, a confidence tier, and the provenance needed to trace it — which model produced it, through</text>
<text xml:space="preserve" text-anchor="start" x="8" y="-16.45" font-family="Helvetica,sans-Serif" font-size="9.00" fill="#5a5a5a">what training cut&#45;off, and on how large a calibration sample. Every call is retained, so any recommendation can be</text>
<text xml:space="preserve" text-anchor="start" x="8" y="-5.95" font-family="Helvetica,sans-Serif" font-size="9.00" fill="#5a5a5a">traced back to the forecast it rests on.</text>
