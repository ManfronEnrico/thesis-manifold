<title>data_pipeline</title>
<text xml:space="preserve" text-anchor="start" x="8" y="-47.95" font-family="Helvetica,sans-Serif" font-size="9.00" fill="#5a5a5a">Construction of the modelling data set. Raw scanner records are validated and aggregated to a brand&#45;by&#45;month panel,</text>
<text xml:space="preserve" text-anchor="start" x="8" y="-37.45" font-family="Helvetica,sans-Serif" font-size="9.00" fill="#5a5a5a">explored to establish its statistical properties, and narrowed by a data contract measured from the panel itself. The</text>
<text xml:space="preserve" text-anchor="start" x="8" y="-26.95" font-family="Helvetica,sans-Serif" font-size="9.00" fill="#5a5a5a">retained series are enriched with calendar and promotional information and turned into modelling matrices. The</text>
<text xml:space="preserve" text-anchor="start" x="8" y="-16.45" font-family="Helvetica,sans-Serif" font-size="9.00" fill="#5a5a5a">matrices hold more rows than the panel because each retained brand&#39;s month grid is completed before lagged features</text>
<text xml:space="preserve" text-anchor="start" x="8" y="-5.95" font-family="Helvetica,sans-Serif" font-size="9.00" fill="#5a5a5a">are built, so that a lag refers to the preceding month rather than to the preceding observation.</text>
