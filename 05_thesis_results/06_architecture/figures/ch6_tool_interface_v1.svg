<g id="graph0" class="graph" transform="scale(1 1) rotate(0) translate(4 477.15)">
<title>tool_interface</title>
<polygon fill="white" stroke="none" points="-4,4 -4,-477.15 989.2,-477.15 989.2,4 -4,4"/>
<text xml:space="preserve" text-anchor="middle" x="492.6" y="-100.45" font-family="Helvetica,sans-Serif" font-size="9.00" fill="#5a5a5a">The structured forecast interface. A demand question is put in</text>
<text xml:space="preserve" text-anchor="middle" x="492.6" y="-89.95" font-family="Helvetica,sans-Serif" font-size="9.00" fill="#5a5a5a">natural language; the agent recognises it as a forecasting task and</text>
<text xml:space="preserve" text-anchor="middle" x="492.6" y="-79.45" font-family="Helvetica,sans-Serif" font-size="9.00" fill="#5a5a5a">resolves it into the arguments the tool accepts. It supplies only an</text>
<text xml:space="preserve" text-anchor="middle" x="492.6" y="-68.95" font-family="Helvetica,sans-Serif" font-size="9.00" fill="#5a5a5a">identifier and a horizon; feature construction remains on the</text>
<text xml:space="preserve" text-anchor="middle" x="492.6" y="-58.45" font-family="Helvetica,sans-Serif" font-size="9.00" fill="#5a5a5a">server, so the language model never handles feature vectors. What</text>
<text xml:space="preserve" text-anchor="middle" x="492.6" y="-47.95" font-family="Helvetica,sans-Serif" font-size="9.00" fill="#5a5a5a">returns is not a bare number but a forecast carrying its</text>
<text xml:space="preserve" text-anchor="middle" x="492.6" y="-37.45" font-family="Helvetica,sans-Serif" font-size="9.00" fill="#5a5a5a">uncertainty, a confidence tier, and the provenance needed to trace</text>
<text xml:space="preserve" text-anchor="middle" x="492.6" y="-26.95" font-family="Helvetica,sans-Serif" font-size="9.00" fill="#5a5a5a">it — which model produced it, through what training cut&#45;off, and on</text>
<text xml:space="preserve" text-anchor="middle" x="492.6" y="-16.45" font-family="Helvetica,sans-Serif" font-size="9.00" fill="#5a5a5a">how large a calibration sample. Every call is retained, so any</text>
<text xml:space="preserve" text-anchor="middle" x="492.6" y="-5.95" font-family="Helvetica,sans-Serif" font-size="9.00" fill="#5a5a5a">recommendation can be traced back to the forecast it rests on.</text>
