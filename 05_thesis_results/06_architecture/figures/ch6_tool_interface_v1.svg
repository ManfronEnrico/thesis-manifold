<g id="graph0" class="graph" transform="scale(1 1) rotate(0) translate(4 435.15)">
<title>tool_interface</title>
<text xml:space="preserve" text-anchor="middle" x="492.6" y="-58.45" font-family="Helvetica,sans-Serif" font-size="9.00" fill="#5a5a5a">The structured forecast interface. A demand question is put in natural language; the agent recognises it as a</text>
<text xml:space="preserve" text-anchor="middle" x="492.6" y="-47.95" font-family="Helvetica,sans-Serif" font-size="9.00" fill="#5a5a5a">forecasting task and resolves it into the arguments the tool accepts. It supplies only an identifier and a horizon;</text>
<text xml:space="preserve" text-anchor="middle" x="492.6" y="-37.45" font-family="Helvetica,sans-Serif" font-size="9.00" fill="#5a5a5a">feature construction remains on the server, so the language model never handles feature vectors. What returns is not a</text>
<text xml:space="preserve" text-anchor="middle" x="492.6" y="-26.95" font-family="Helvetica,sans-Serif" font-size="9.00" fill="#5a5a5a">bare number but a forecast carrying its uncertainty, a confidence tier, and the provenance needed to trace it — which</text>
<text xml:space="preserve" text-anchor="middle" x="492.6" y="-16.45" font-family="Helvetica,sans-Serif" font-size="9.00" fill="#5a5a5a">model produced it, through what training cut&#45;off, and on how large a calibration sample. Every call is retained, so</text>
<text xml:space="preserve" text-anchor="middle" x="492.6" y="-5.95" font-family="Helvetica,sans-Serif" font-size="9.00" fill="#5a5a5a">any recommendation can be traced back to the forecast it rests on.</text>
