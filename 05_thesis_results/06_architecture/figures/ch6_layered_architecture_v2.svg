<g id="graph0" class="graph" transform="scale(1 1) rotate(0) translate(4 507.45)">
<title>layered_architecture</title>
<polygon fill="white" stroke="none" points="-4,4 -4,-507.45 918.66,-507.45 918.66,4 -4,4"/>
<text xml:space="preserve" text-anchor="middle" x="457.33" y="-100.45" font-family="Helvetica,sans-Serif" font-size="9.00" fill="#5a5a5a">The predictive extension in three layers. Candidate models are</text>
<text xml:space="preserve" text-anchor="middle" x="457.33" y="-89.95" font-family="Helvetica,sans-Serif" font-size="9.00" fill="#5a5a5a">benchmarked on identical data and one is deployed per product</text>
<text xml:space="preserve" text-anchor="middle" x="457.33" y="-79.45" font-family="Helvetica,sans-Serif" font-size="9.00" fill="#5a5a5a">category; the tool interface exposes its forecasts with uncertainty</text>
<text xml:space="preserve" text-anchor="middle" x="457.33" y="-68.95" font-family="Helvetica,sans-Serif" font-size="9.00" fill="#5a5a5a">and provenance attached; and only the model&#45;equipped condition draws</text>
<text xml:space="preserve" text-anchor="middle" x="457.33" y="-58.45" font-family="Helvetica,sans-Serif" font-size="9.00" fill="#5a5a5a">on that interface. The three conditions are stated in terms of the</text>
<text xml:space="preserve" text-anchor="middle" x="457.33" y="-47.95" font-family="Helvetica,sans-Serif" font-size="9.00" fill="#5a5a5a">agent rather than of a particular engine, so they apply equally to</text>
<text xml:space="preserve" text-anchor="middle" x="457.33" y="-37.45" font-family="Helvetica,sans-Serif" font-size="9.00" fill="#5a5a5a">the local orchestrator and to the production platform. The language</text>
<text xml:space="preserve" text-anchor="middle" x="457.33" y="-26.95" font-family="Helvetica,sans-Serif" font-size="9.00" fill="#5a5a5a">model is reached over an API rather than hosted locally, so the</text>
<text xml:space="preserve" text-anchor="middle" x="457.33" y="-16.45" font-family="Helvetica,sans-Serif" font-size="9.00" fill="#5a5a5a">deployment envelope of 4 GB is spent on data and models alone — the</text>
<text xml:space="preserve" text-anchor="middle" x="457.33" y="-5.95" font-family="Helvetica,sans-Serif" font-size="9.00" fill="#5a5a5a">most demanding model observed requires 34 MB to fit.</text>
