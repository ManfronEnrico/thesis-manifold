<title>layered_architecture</title>
<polygon fill="white" stroke="none" points="-4,4 -4,-358 858.07,-358 858.07,4 -4,4"/>
<text xml:space="preserve" text-anchor="middle" x="427.04" y="-58.45" font-family="Helvetica,sans-Serif" font-size="9.00" fill="#5a5a5a">The predictive extension in three layers. Candidate models are benchmarked on identical data and one is deployed per</text>
<text xml:space="preserve" text-anchor="middle" x="427.04" y="-47.95" font-family="Helvetica,sans-Serif" font-size="9.00" fill="#5a5a5a">product category; the tool interface exposes its forecasts with uncertainty and provenance attached; and only the</text>
<text xml:space="preserve" text-anchor="middle" x="427.04" y="-37.45" font-family="Helvetica,sans-Serif" font-size="9.00" fill="#5a5a5a">model&#45;equipped condition draws on that interface. The three conditions are stated in terms of the agent rather than of</text>
<text xml:space="preserve" text-anchor="middle" x="427.04" y="-26.95" font-family="Helvetica,sans-Serif" font-size="9.00" fill="#5a5a5a">a particular engine, so they apply equally to the local orchestrator and to the production platform. The language</text>
<text xml:space="preserve" text-anchor="middle" x="427.04" y="-16.45" font-family="Helvetica,sans-Serif" font-size="9.00" fill="#5a5a5a">model is reached over an API rather than hosted locally, so the deployment envelope of 4 GB is spent on data and</text>
<text xml:space="preserve" text-anchor="middle" x="427.04" y="-5.95" font-family="Helvetica,sans-Serif" font-size="9.00" fill="#5a5a5a">models alone — the most demanding model observed requires 38 MB to fit.</text>
