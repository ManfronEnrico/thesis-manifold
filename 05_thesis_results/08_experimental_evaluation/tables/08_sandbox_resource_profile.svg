<text xml:space="preserve" text-anchor="start" x="10" y="-244.75" font-family="Cambria" font-size="9.00" fill="#5a5a5a">Note. The limit is read from the container at run time, and</text>
<text xml:space="preserve" text-anchor="start" x="10" y="-231.5" font-family="Cambria" font-size="9.00" fill="#5a5a5a">so corroborates the provisioned budget independently of the</text>
<text xml:space="preserve" text-anchor="start" x="10" y="-218.25" font-family="Cambria" font-size="9.00" fill="#5a5a5a">deployment configuration. Absolute figures are lower than</text>
<text xml:space="preserve" text-anchor="start" x="10" y="-205" font-family="Cambria" font-size="9.00" fill="#5a5a5a">those measured on the development machine because the</text>
<text xml:space="preserve" text-anchor="start" x="10" y="-191.75" font-family="Cambria" font-size="9.00" fill="#5a5a5a">container provides a single processor core, so the</text>
<text xml:space="preserve" text-anchor="start" x="10" y="-178.5" font-family="Cambria" font-size="9.00" fill="#5a5a5a">tree&#45;based learners allocate fewer parallel working buffers.</text>
<text xml:space="preserve" text-anchor="start" x="10" y="-165.25" font-family="Cambria" font-size="9.00" fill="#5a5a5a">That the interpreter and its libraries occupy more memory</text>
<text xml:space="preserve" text-anchor="start" x="10" y="-152" font-family="Cambria" font-size="9.00" fill="#5a5a5a">than any model fit is the expected profile for lightweight</text>
<text xml:space="preserve" text-anchor="start" x="10" y="-138.75" font-family="Cambria" font-size="9.00" fill="#5a5a5a">models, and confirms that the constraint operates on the</text>
<text xml:space="preserve" text-anchor="start" x="10" y="-125.5" font-family="Cambria" font-size="9.00" fill="#5a5a5a">choice of model class rather than on the footprint of the</text>
<text xml:space="preserve" text-anchor="start" x="10" y="-112.25" font-family="Cambria" font-size="9.00" fill="#5a5a5a">models finally selected.</text>
