<text xml:space="preserve" text-anchor="start" x="241.5" y="-270" font-family="Cambria" font-size="10.00" fill="#5a5a5a">second best</text>
<text xml:space="preserve" text-anchor="start" x="9" y="-243.75" font-family="Cambria" font-size="9.00" fill="#5a5a5a">Note. The limit is read from the container at run time, and</text>
<text xml:space="preserve" text-anchor="start" x="9" y="-230.5" font-family="Cambria" font-size="9.00" fill="#5a5a5a">so corroborates the provisioned budget independently of the</text>
<text xml:space="preserve" text-anchor="start" x="9" y="-217.25" font-family="Cambria" font-size="9.00" fill="#5a5a5a">deployment configuration. Absolute figures are lower than</text>
<text xml:space="preserve" text-anchor="start" x="9" y="-204" font-family="Cambria" font-size="9.00" fill="#5a5a5a">those measured on the development machine because the</text>
<text xml:space="preserve" text-anchor="start" x="9" y="-190.75" font-family="Cambria" font-size="9.00" fill="#5a5a5a">container provides a single processor core, so the</text>
<text xml:space="preserve" text-anchor="start" x="9" y="-177.5" font-family="Cambria" font-size="9.00" fill="#5a5a5a">tree&#45;based learners allocate fewer parallel working buffers.</text>
<text xml:space="preserve" text-anchor="start" x="9" y="-164.25" font-family="Cambria" font-size="9.00" fill="#5a5a5a">That the interpreter and its libraries occupy more memory</text>
<text xml:space="preserve" text-anchor="start" x="9" y="-151" font-family="Cambria" font-size="9.00" fill="#5a5a5a">than any model fit is the expected profile for lightweight</text>
<text xml:space="preserve" text-anchor="start" x="9" y="-137.75" font-family="Cambria" font-size="9.00" fill="#5a5a5a">models, and confirms that the constraint operates on the</text>
<text xml:space="preserve" text-anchor="start" x="9" y="-124.5" font-family="Cambria" font-size="9.00" fill="#5a5a5a">choice of model class rather than on the footprint of the</text>
<text xml:space="preserve" text-anchor="start" x="9" y="-111.25" font-family="Cambria" font-size="9.00" fill="#5a5a5a">models finally selected.</text>
