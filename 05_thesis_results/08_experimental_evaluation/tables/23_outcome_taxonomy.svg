<text xml:space="preserve" text-anchor="start" x="9" y="-79" font-family="Cambria" font-size="9.00" fill="#5a5a5a">Note. Scenarios are abbreviated to their letter: A = A_llm_plain; B = B_llm_data; C = C_llm_model; D = D_prometheus_data; E = E_prometheus_model; F =</text>
<text xml:space="preserve" text-anchor="start" x="9" y="-65.75" font-family="Cambria" font-size="9.00" fill="#5a5a5a">F_llm_data_model; G = G_prometheus_data_model. Failures are reported as classes rather than averaged into the accuracy figures. A scenario that returns a usable</text>
<text xml:space="preserve" text-anchor="start" x="9" y="-52.5" font-family="Cambria" font-size="9.00" fill="#5a5a5a">answer in a fraction of runs is not directly comparable to one that always answers, and a single implausible value distorts a mean without bound; classifying</text>
<text xml:space="preserve" text-anchor="start" x="9" y="-39.25" font-family="Cambria" font-size="9.00" fill="#5a5a5a">such runs preserves both facts.</text>
