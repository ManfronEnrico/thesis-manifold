<text xml:space="preserve" text-anchor="middle" x="211.88" y="-78.5" font-family="Cambria" font-size="10.00" fill="#5a5a5a">Memory required to fit each model within the production</text>
<text xml:space="preserve" text-anchor="middle" x="211.88" y="-66.5" font-family="Cambria" font-size="10.00" fill="#5a5a5a">sandbox, measured in the deployment environment itself</text>
<text xml:space="preserve" text-anchor="middle" x="211.88" y="-54.5" font-family="Cambria" font-size="10.00" fill="#5a5a5a">rather than on a development machine. The container reports</text>
<text xml:space="preserve" text-anchor="middle" x="211.88" y="-42.5" font-family="Cambria" font-size="10.00" fill="#5a5a5a">a memory limit of 4,122 MB and provides 1 processor core;</text>
<text xml:space="preserve" text-anchor="middle" x="211.88" y="-30.5" font-family="Cambria" font-size="10.00" fill="#5a5a5a">the interpreter and its libraries occupy 156.4 MB, or 3.79%</text>
<text xml:space="preserve" text-anchor="middle" x="211.88" y="-18.5" font-family="Cambria" font-size="10.00" fill="#5a5a5a">of that limit, before any model is fitted. The lowest value</text>
<text xml:space="preserve" text-anchor="middle" x="211.88" y="-6.5" font-family="Cambria" font-size="10.00" fill="#5a5a5a">in each row is shown in bold italic.</text>
