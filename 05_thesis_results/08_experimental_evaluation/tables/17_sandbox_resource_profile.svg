<text xml:space="preserve" text-anchor="start" x="9" y="-177.5" font-family="Cambria" font-size="9.00" fill="#5a5a5a">Note. The limit is read from the container at run time, and so corroborates the provisioned budget</text>
<text xml:space="preserve" text-anchor="start" x="9" y="-164.25" font-family="Cambria" font-size="9.00" fill="#5a5a5a">independently of the deployment configuration. Absolute figures are lower than those measured on the</text>
<text xml:space="preserve" text-anchor="start" x="9" y="-151" font-family="Cambria" font-size="9.00" fill="#5a5a5a">development machine because the container provides a single processor core, so the tree&#45;based learners</text>
<text xml:space="preserve" text-anchor="start" x="9" y="-137.75" font-family="Cambria" font-size="9.00" fill="#5a5a5a">allocate fewer parallel working buffers. That the interpreter and its libraries occupy more memory than</text>
<text xml:space="preserve" text-anchor="start" x="9" y="-124.5" font-family="Cambria" font-size="9.00" fill="#5a5a5a">any model fit is the expected profile for lightweight models, and confirms that the constraint operates</text>
<text xml:space="preserve" text-anchor="start" x="9" y="-111.25" font-family="Cambria" font-size="9.00" fill="#5a5a5a">on the choice of model class rather than on the footprint of the models finally selected.</text>
