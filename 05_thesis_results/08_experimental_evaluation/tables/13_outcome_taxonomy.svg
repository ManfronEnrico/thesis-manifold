<text xml:space="preserve" text-anchor="start" x="10" y="-93.25" font-family="Cambria" font-size="9.00" fill="#5a5a5a">C_llm_model; D = D_prometheus_data; E = E_prometheus_model; F = F_llm_data_model; G =</text>
<text xml:space="preserve" text-anchor="start" x="10" y="-80" font-family="Cambria" font-size="9.00" fill="#5a5a5a">G_prometheus_data_model. Failures are reported as classes rather than averaged into the accuracy</text>
<text xml:space="preserve" text-anchor="start" x="10" y="-66.75" font-family="Cambria" font-size="9.00" fill="#5a5a5a">figures. A scenario that returns a usable answer in a fraction of runs is not directly</text>
<text xml:space="preserve" text-anchor="start" x="10" y="-53.5" font-family="Cambria" font-size="9.00" fill="#5a5a5a">comparable to one that always answers, and a single implausible value distorts a mean without</text>
<text xml:space="preserve" text-anchor="start" x="10" y="-40.25" font-family="Cambria" font-size="9.00" fill="#5a5a5a">bound; classifying such runs preserves both facts.</text>
