<text xml:space="preserve" text-anchor="middle" x="630.95" y="-37.45" font-family="Helvetica,sans-Serif" font-size="9.00" fill="#5a5a5a">Methodological structure of the thesis. A pragmatist position grounds the choice of Design Science Research, whose six</text>
<text xml:space="preserve" text-anchor="middle" x="630.95" y="-26.95" font-family="Helvetica,sans-Serif" font-size="9.00" fill="#5a5a5a">process activities are realised across the chapters named; the research design then specifies what is studied and with</text>
