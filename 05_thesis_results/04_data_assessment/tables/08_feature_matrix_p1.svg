<text xml:space="preserve" text-anchor="start" x="9" y="-141.5" font-family="Cambria" font-size="9.00" fill="#5a5a5a">Note. The target is sales_units, modelled as log1p and inverted for reporting. Splits are chronological: training 2022&#45;10 to</text>
<text xml:space="preserve" text-anchor="start" x="9" y="-128.25" font-family="Cambria" font-size="9.00" fill="#5a5a5a">2025&#45;05, validation 2025&#45;06 to 2025&#45;12, test 2026&#45;01 to 2026&#45;07. The 12 columns marked excluded are same&#45;period sales and</text>
<text xml:space="preserve" text-anchor="start" x="9" y="-115" font-family="Cambria" font-size="9.00" fill="#5a5a5a">baseline measures, retained so a prediction can be traced back to the observation it was made from; they are not available to the</text>
<text xml:space="preserve" text-anchor="start" x="9" y="-101.75" font-family="Cambria" font-size="9.00" fill="#5a5a5a">model, which would otherwise observe the quantity it is asked to predict. Populated is the share of rows with a value:</text>
<text xml:space="preserve" text-anchor="start" x="9" y="-88.5" font-family="Cambria" font-size="9.00" fill="#5a5a5a">autoregressive features are empty for a brand&#39;s earliest months by construction. Columns are ordered by role, so the grouping</text>
<text xml:space="preserve" text-anchor="start" x="9" y="-75.25" font-family="Cambria" font-size="9.00" fill="#5a5a5a">continues across parts.</text>
