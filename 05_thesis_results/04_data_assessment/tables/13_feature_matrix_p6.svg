<text xml:space="preserve" text-anchor="start" x="9" y="-116.25" font-family="Cambria" font-size="9.00" fill="#5a5a5a">Note. The target is sales_units, modelled as log1p and inverted for reporting. Splits are chronological: training 2022&#45;10 to 2025&#45;05, validation</text>
<text xml:space="preserve" text-anchor="start" x="9" y="-103" font-family="Cambria" font-size="9.00" fill="#5a5a5a">2025&#45;06 to 2025&#45;12, test 2026&#45;01 to 2026&#45;07. The 12 columns marked excluded are same&#45;period sales and baseline measures, retained so a prediction</text>
<text xml:space="preserve" text-anchor="start" x="9" y="-89.75" font-family="Cambria" font-size="9.00" fill="#5a5a5a">can be traced back to the observation it was made from; they are not available to the model, which would otherwise observe the quantity it is asked</text>
<text xml:space="preserve" text-anchor="start" x="9" y="-76.5" font-family="Cambria" font-size="9.00" fill="#5a5a5a">to predict. Populated is the share of rows with a value: autoregressive features are empty for a brand&#39;s earliest months by construction. Columns</text>
<text xml:space="preserve" text-anchor="start" x="9" y="-63.25" font-family="Cambria" font-size="9.00" fill="#5a5a5a">are ordered by role, so the grouping continues across parts.</text>
