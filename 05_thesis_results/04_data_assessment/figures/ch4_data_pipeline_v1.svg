<text xml:space="preserve" text-anchor="middle" x="271.07" y="-89.95" font-family="Helvetica,sans-Serif" font-size="9.00" fill="#5a5a5a">Construction of the modelling data set. Raw scanner records are</text>
<text xml:space="preserve" text-anchor="middle" x="271.07" y="-79.45" font-family="Helvetica,sans-Serif" font-size="9.00" fill="#5a5a5a">validated and aggregated to a brand&#45;by&#45;month panel, explored to</text>
<text xml:space="preserve" text-anchor="middle" x="271.07" y="-68.95" font-family="Helvetica,sans-Serif" font-size="9.00" fill="#5a5a5a">establish its statistical properties, and narrowed by a data</text>
<text xml:space="preserve" text-anchor="middle" x="271.07" y="-58.45" font-family="Helvetica,sans-Serif" font-size="9.00" fill="#5a5a5a">contract measured from the panel itself. The retained series are</text>
<text xml:space="preserve" text-anchor="middle" x="271.07" y="-47.95" font-family="Helvetica,sans-Serif" font-size="9.00" fill="#5a5a5a">enriched with calendar and promotional information and turned into</text>
<text xml:space="preserve" text-anchor="middle" x="271.07" y="-37.45" font-family="Helvetica,sans-Serif" font-size="9.00" fill="#5a5a5a">modelling matrices. The matrices hold more rows than the panel</text>
<text xml:space="preserve" text-anchor="middle" x="271.07" y="-26.95" font-family="Helvetica,sans-Serif" font-size="9.00" fill="#5a5a5a">because each retained brand&#39;s month grid is completed before lagged</text>
<text xml:space="preserve" text-anchor="middle" x="271.07" y="-16.45" font-family="Helvetica,sans-Serif" font-size="9.00" fill="#5a5a5a">features are built, so that a lag refers to the preceding month</text>
<text xml:space="preserve" text-anchor="middle" x="271.07" y="-5.95" font-family="Helvetica,sans-Serif" font-size="9.00" fill="#5a5a5a">rather than to the preceding observation.</text>
