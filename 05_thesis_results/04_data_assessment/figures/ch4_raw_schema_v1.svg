<text xml:space="preserve" text-anchor="middle" x="429.42" y="-58.45" font-family="Helvetica,sans-Serif" font-size="9.00" fill="#5a5a5a">The source data as delivered, shown for carbonated soft drinks, the worked category: one fact table of weekly measures</text>
<text xml:space="preserve" text-anchor="middle" x="429.42" y="-47.95" font-family="Helvetica,sans-Serif" font-size="9.00" fill="#5a5a5a">joined to three dimensions by product, market and period. The join keys and the period and market dimensions are</text>
<text xml:space="preserve" text-anchor="middle" x="429.42" y="-37.45" font-family="Helvetica,sans-Serif" font-size="9.00" fill="#5a5a5a">identical across categories, but the payload is not — the carbonated&#45;soft&#45;drinks fact view carries 29 measures against</text>
<text xml:space="preserve" text-anchor="middle" x="429.42" y="-26.95" font-family="Helvetica,sans-Serif" font-size="9.00" fill="#5a5a5a">12 for bottled water, which lacks the promotional and baseline measures entirely, and each category describes its</text>
<text xml:space="preserve" text-anchor="middle" x="429.42" y="-16.45" font-family="Helvetica,sans-Serif" font-size="9.00" fill="#5a5a5a">products with its own attributes. This is why the categories are preprocessed by category&#45;specific scripts rather than</text>
<text xml:space="preserve" text-anchor="middle" x="429.42" y="-5.95" font-family="Helvetica,sans-Serif" font-size="9.00" fill="#5a5a5a">one shared pass.</text>
