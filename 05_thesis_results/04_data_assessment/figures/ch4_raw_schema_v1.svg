<title>raw_schema</title>
<polygon fill="white" stroke="none" points="-4,4 -4,-430.4 862.84,-430.4 862.84,4 -4,4"/>
<text xml:space="preserve" text-anchor="middle" x="429.42" y="-100.45" font-family="Helvetica,sans-Serif" font-size="9.00" fill="#5a5a5a">The source data as delivered, shown for carbonated soft drinks, the</text>
<text xml:space="preserve" text-anchor="middle" x="429.42" y="-89.95" font-family="Helvetica,sans-Serif" font-size="9.00" fill="#5a5a5a">worked category: one fact table of weekly measures joined to three</text>
<text xml:space="preserve" text-anchor="middle" x="429.42" y="-79.45" font-family="Helvetica,sans-Serif" font-size="9.00" fill="#5a5a5a">dimensions by product, market and period. The join keys and the</text>
<text xml:space="preserve" text-anchor="middle" x="429.42" y="-68.95" font-family="Helvetica,sans-Serif" font-size="9.00" fill="#5a5a5a">period and market dimensions are identical across categories, but</text>
<text xml:space="preserve" text-anchor="middle" x="429.42" y="-58.45" font-family="Helvetica,sans-Serif" font-size="9.00" fill="#5a5a5a">the payload is not — the carbonated&#45;soft&#45;drinks fact view carries 29</text>
<text xml:space="preserve" text-anchor="middle" x="429.42" y="-47.95" font-family="Helvetica,sans-Serif" font-size="9.00" fill="#5a5a5a">measures against 12 for bottled water, which lacks the promotional</text>
<text xml:space="preserve" text-anchor="middle" x="429.42" y="-37.45" font-family="Helvetica,sans-Serif" font-size="9.00" fill="#5a5a5a">and baseline measures entirely, and each category describes its</text>
<text xml:space="preserve" text-anchor="middle" x="429.42" y="-26.95" font-family="Helvetica,sans-Serif" font-size="9.00" fill="#5a5a5a">products with its own attributes. This is why the categories are</text>
<text xml:space="preserve" text-anchor="middle" x="429.42" y="-16.45" font-family="Helvetica,sans-Serif" font-size="9.00" fill="#5a5a5a">preprocessed by category&#45;specific scripts rather than one shared</text>
<text xml:space="preserve" text-anchor="middle" x="429.42" y="-5.95" font-family="Helvetica,sans-Serif" font-size="9.00" fill="#5a5a5a">pass.</text>
