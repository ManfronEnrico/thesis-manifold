<text xml:space="preserve" text-anchor="middle" x="392.93" y="-89.95" font-family="Helvetica,sans-Serif" font-size="9.00" fill="#5a5a5a">Exploratory analysis of a single product category, shown as the</text>
<text xml:space="preserve" text-anchor="middle" x="392.93" y="-79.45" font-family="Helvetica,sans-Serif" font-size="9.00" fill="#5a5a5a">worked example; every category is analysed identically. The panel is</text>
<text xml:space="preserve" text-anchor="middle" x="392.93" y="-68.95" font-family="Helvetica,sans-Serif" font-size="9.00" fill="#5a5a5a">examined along four lines of enquiry — its structure and quality,</text>
<text xml:space="preserve" text-anchor="middle" x="392.93" y="-58.45" font-family="Helvetica,sans-Serif" font-size="9.00" fill="#5a5a5a">the coverage and retention of individual brands, its stationarity</text>
<text xml:space="preserve" text-anchor="middle" x="392.93" y="-47.95" font-family="Helvetica,sans-Serif" font-size="9.00" fill="#5a5a5a">and seasonality, and the candidate demand drivers together with</text>
<text xml:space="preserve" text-anchor="middle" x="392.93" y="-37.45" font-family="Helvetica,sans-Serif" font-size="9.00" fill="#5a5a5a">their redundancy. The findings are documented as tables and figures,</text>
<text xml:space="preserve" text-anchor="middle" x="392.93" y="-26.95" font-family="Helvetica,sans-Serif" font-size="9.00" fill="#5a5a5a">and are what the subsequent data contract is measured from, so that</text>
<text xml:space="preserve" text-anchor="middle" x="392.93" y="-16.45" font-family="Helvetica,sans-Serif" font-size="9.00" fill="#5a5a5a">decisions about lag depth, series length and transformation follow</text>
<text xml:space="preserve" text-anchor="middle" x="392.93" y="-5.95" font-family="Helvetica,sans-Serif" font-size="9.00" fill="#5a5a5a">from the data rather than from convention.</text>
