<title>modelling</title>
<polygon fill="white" stroke="none" points="-4,4 -4,-457.95 1043.2,-457.95 1043.2,4 -4,4"/>
<text xml:space="preserve" text-anchor="middle" x="519.6" y="-89.95" font-family="Helvetica,sans-Serif" font-size="9.00" fill="#5a5a5a">Model selection. Each candidate is fitted independently on the same</text>
<text xml:space="preserve" text-anchor="middle" x="519.6" y="-79.45" font-family="Helvetica,sans-Serif" font-size="9.00" fill="#5a5a5a">data, under two training arms — one model per product category, and</text>
<text xml:space="preserve" text-anchor="middle" x="519.6" y="-68.95" font-family="Helvetica,sans-Serif" font-size="9.00" fill="#5a5a5a">a single pooled model with category as a feature — and is evaluated</text>
<text xml:space="preserve" text-anchor="middle" x="519.6" y="-58.45" font-family="Helvetica,sans-Serif" font-size="9.00" fill="#5a5a5a">against statistical baselines on held&#45;out months. Neither training</text>
<text xml:space="preserve" text-anchor="middle" x="519.6" y="-47.95" font-family="Helvetica,sans-Serif" font-size="9.00" fill="#5a5a5a">arm dominates: category&#45;specific training achieves the lower error</text>
<text xml:space="preserve" text-anchor="middle" x="519.6" y="-37.45" font-family="Helvetica,sans-Serif" font-size="9.00" fill="#5a5a5a">in 2 of 4 categories and pooled training in the remainder, so the</text>
<text xml:space="preserve" text-anchor="middle" x="519.6" y="-26.95" font-family="Helvetica,sans-Serif" font-size="9.00" fill="#5a5a5a">choice is made per category rather than in general. The model with</text>
<text xml:space="preserve" text-anchor="middle" x="519.6" y="-16.45" font-family="Helvetica,sans-Serif" font-size="9.00" fill="#5a5a5a">the lowest error in each category is retrained on the full training</text>
<text xml:space="preserve" text-anchor="middle" x="519.6" y="-5.95" font-family="Helvetica,sans-Serif" font-size="9.00" fill="#5a5a5a">window and deployed.</text>
