<text xml:space="preserve" text-anchor="start" x="9" y="-194.5" font-family="Cambria" font-size="9.00" fill="#5a5a5a">Note. Models with a stochastic fitting procedure, which</text>
<text xml:space="preserve" text-anchor="start" x="9" y="-181.25" font-family="Cambria" font-size="9.00" fill="#5a5a5a">includes gradient&#45;boosted trees, can return different</text>
<text xml:space="preserve" text-anchor="start" x="9" y="-168" font-family="Cambria" font-size="9.00" fill="#5a5a5a">parameters from identical data. Seed sensitivity is</text>
<text xml:space="preserve" text-anchor="start" x="9" y="-154.75" font-family="Cambria" font-size="9.00" fill="#5a5a5a">therefore measured rather than assumed, following the</text>
<text xml:space="preserve" text-anchor="start" x="9" y="-141.5" font-family="Cambria" font-size="9.00" fill="#5a5a5a">stability criterion of Klee and Xia (2025). The coefficient</text>
<text xml:space="preserve" text-anchor="start" x="9" y="-128.25" font-family="Cambria" font-size="9.00" fill="#5a5a5a">of variation measures dispersion of the forecasts</text>
<text xml:space="preserve" text-anchor="start" x="9" y="-115" font-family="Cambria" font-size="9.00" fill="#5a5a5a">themselves; the standard deviation of WMAPE measures how far</text>
<text xml:space="preserve" text-anchor="start" x="9" y="-101.75" font-family="Cambria" font-size="9.00" fill="#5a5a5a">the resulting accuracy moves. mWMAPE (%) = mean WMAPE across</text>
<text xml:space="preserve" text-anchor="start" x="9" y="-88.5" font-family="Cambria" font-size="9.00" fill="#5a5a5a">seeds; sdWMAPE (pp) = its standard deviation; medCV (%) =</text>
<text xml:space="preserve" text-anchor="start" x="9" y="-75.25" font-family="Cambria" font-size="9.00" fill="#5a5a5a">median coefficient of variation of the forecasts.</text>
