<text xml:space="preserve" text-anchor="start" x="9" y="-101.75" font-family="Cambria" font-size="9.00" fill="#5a5a5a">Note. The mean difference across origins is +0.28 percentage points, and individual origins fall on both sides of zero. Over the period observed there is</text>
<text xml:space="preserve" text-anchor="start" x="9" y="-88.5" font-family="Cambria" font-size="9.00" fill="#5a5a5a">therefore no detectable penalty from holding hyperparameters fixed. The window is short and the number of origins small, so this should be read as an absence of</text>
<text xml:space="preserve" text-anchor="start" x="9" y="-75.25" font-family="Cambria" font-size="9.00" fill="#5a5a5a">evidence at this horizon rather than as evidence that no drift occurs over longer ones.</text>
