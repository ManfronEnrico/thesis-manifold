<text xml:space="preserve" text-anchor="start" x="9" y="-128.25" font-family="Cambria" font-size="9.00" fill="#5a5a5a">Note. The mean difference across origins is +0.28 percentage points, and individual origins fall</text>
<text xml:space="preserve" text-anchor="start" x="9" y="-115" font-family="Cambria" font-size="9.00" fill="#5a5a5a">on both sides of zero. Over the period observed there is therefore no detectable penalty from</text>
<text xml:space="preserve" text-anchor="start" x="9" y="-101.75" font-family="Cambria" font-size="9.00" fill="#5a5a5a">holding hyperparameters fixed. The window is short and the number of origins small, so this</text>
<text xml:space="preserve" text-anchor="start" x="9" y="-88.5" font-family="Cambria" font-size="9.00" fill="#5a5a5a">should be read as an absence of evidence at this horizon rather than as evidence that no drift</text>
<text xml:space="preserve" text-anchor="start" x="9" y="-75.25" font-family="Cambria" font-size="9.00" fill="#5a5a5a">occurs over longer ones.</text>
