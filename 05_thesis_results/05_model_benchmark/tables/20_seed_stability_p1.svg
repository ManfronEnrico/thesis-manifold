<text xml:space="preserve" text-anchor="start" x="9" y="-166.75" font-family="Cambria" font-size="9.00" fill="#5a5a5a">Note. Models with a stochastic fitting procedure, which includes gradient&#45;boosted trees,</text>
<text xml:space="preserve" text-anchor="start" x="9" y="-153.5" font-family="Cambria" font-size="9.00" fill="#5a5a5a">can return different parameters from identical data. Seed sensitivity is therefore</text>
<text xml:space="preserve" text-anchor="start" x="9" y="-140.25" font-family="Cambria" font-size="9.00" fill="#5a5a5a">measured rather than assumed, following the stability criterion of Klee and Xia (2025).</text>
<text xml:space="preserve" text-anchor="start" x="9" y="-127" font-family="Cambria" font-size="9.00" fill="#5a5a5a">The coefficient of variation measures dispersion of the forecasts themselves; the</text>
<text xml:space="preserve" text-anchor="start" x="9" y="-113.75" font-family="Cambria" font-size="9.00" fill="#5a5a5a">standard deviation of WMAPE measures how far the resulting accuracy moves. mWMAPE (%) =</text>
<text xml:space="preserve" text-anchor="start" x="9" y="-100.5" font-family="Cambria" font-size="9.00" fill="#5a5a5a">mean WMAPE across seeds; sdWMAPE (pp) = its standard deviation; medCV (%) = median</text>
<text xml:space="preserve" text-anchor="start" x="9" y="-87.25" font-family="Cambria" font-size="9.00" fill="#5a5a5a">coefficient of variation of the forecasts.</text>
