<text xml:space="preserve" text-anchor="start" x="9" y="-101.75" font-family="Cambria" font-size="9.00" fill="#5a5a5a">Note. One model is served per category, selected on cross&#45;validated score. `Interval q90 (log)` is the split&#45;conformal quantile of the validation residuals in</text>
