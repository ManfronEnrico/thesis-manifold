<text xml:space="preserve" text-anchor="start" x="9" y="-115" font-family="Cambria" font-size="9.00" fill="#5a5a5a">Note. Refitting re&#45;estimates model coefficients only. Re&#45;tuning repeats a cross&#45;validated fit for every trial of the search, so its cost is the cost of one fit</text>
<text xml:space="preserve" text-anchor="start" x="9" y="-101.75" font-family="Cambria" font-size="9.00" fill="#5a5a5a">multiplied by the number of trials and the number of folds. This difference in elapsed time, rather than any difference in accuracy, is the basis on which</text>
<text xml:space="preserve" text-anchor="start" x="9" y="-88.5" font-family="Cambria" font-size="9.00" fill="#5a5a5a">refitting on request is adopted and re&#45;tuning on request is not: memory remains within budget in every case, and the accuracy figures fall within the range</text>
<text xml:space="preserve" text-anchor="start" x="9" y="-75.25" font-family="Cambria" font-size="9.00" fill="#5a5a5a">produced by changing only the random seed of the search, so they cannot separate the two strategies.</text>
