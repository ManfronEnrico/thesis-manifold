<text xml:space="preserve" text-anchor="start" x="10" y="-116" font-family="Cambria" font-size="9.00" fill="#5a5a5a">Note. One model is served per category, selected on cross&#45;validated score. `Interval q90 (log)`</text>
<text xml:space="preserve" text-anchor="start" x="10" y="-102.75" font-family="Cambria" font-size="9.00" fill="#5a5a5a">is the split&#45;conformal quantile of the validation residuals in log space, which is what sets the</text>
<text xml:space="preserve" text-anchor="start" x="10" y="-89.5" font-family="Cambria" font-size="9.00" fill="#5a5a5a">width of the 90% prediction interval the tool returns. Input counts differ because promotional</text>
<text xml:space="preserve" text-anchor="start" x="10" y="-76.25" font-family="Cambria" font-size="9.00" fill="#5a5a5a">measures are absent for two categories, where the column is omitted rather than zero&#45;filled.</text>
