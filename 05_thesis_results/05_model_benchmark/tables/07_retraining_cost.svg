<text xml:space="preserve" text-anchor="start" x="10" y="-155.75" font-family="Cambria" font-size="9.00" fill="#5a5a5a">Note. Refitting re&#45;estimates model coefficients only. Re&#45;tuning repeats a cross&#45;validated fit</text>
<text xml:space="preserve" text-anchor="start" x="10" y="-142.5" font-family="Cambria" font-size="9.00" fill="#5a5a5a">for every trial of the search, so its cost is the cost of one fit multiplied by the number of</text>
<text xml:space="preserve" text-anchor="start" x="10" y="-129.25" font-family="Cambria" font-size="9.00" fill="#5a5a5a">trials and the number of folds. This difference in elapsed time, rather than any difference in</text>
<text xml:space="preserve" text-anchor="start" x="10" y="-116" font-family="Cambria" font-size="9.00" fill="#5a5a5a">accuracy, is the basis on which refitting on request is adopted and re&#45;tuning on request is not:</text>
<text xml:space="preserve" text-anchor="start" x="10" y="-102.75" font-family="Cambria" font-size="9.00" fill="#5a5a5a">memory remains within budget in every case, and the accuracy figures fall within the range</text>
<text xml:space="preserve" text-anchor="start" x="10" y="-89.5" font-family="Cambria" font-size="9.00" fill="#5a5a5a">produced by changing only the random seed of the search, so they cannot separate the two</text>
<text xml:space="preserve" text-anchor="start" x="10" y="-76.25" font-family="Cambria" font-size="9.00" fill="#5a5a5a">strategies.</text>
