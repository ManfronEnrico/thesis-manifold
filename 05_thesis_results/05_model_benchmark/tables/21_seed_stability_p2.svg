<text xml:space="preserve" text-anchor="start" x="9" y="-166.75" font-family="Cambria" font-size="9.00" fill="#5a5a5a">Note. Models with a stochastic fitting procedure, which includes gradient&#45;boosted</text>
<text xml:space="preserve" text-anchor="start" x="9" y="-153.5" font-family="Cambria" font-size="9.00" fill="#5a5a5a">trees, can return different parameters from identical data. Seed sensitivity is</text>
<text xml:space="preserve" text-anchor="start" x="9" y="-140.25" font-family="Cambria" font-size="9.00" fill="#5a5a5a">therefore measured rather than assumed, following the stability criterion of Klee and</text>
<text xml:space="preserve" text-anchor="start" x="9" y="-127" font-family="Cambria" font-size="9.00" fill="#5a5a5a">Xia (2025). The coefficient of variation measures dispersion of the forecasts</text>
<text xml:space="preserve" text-anchor="start" x="9" y="-113.75" font-family="Cambria" font-size="9.00" fill="#5a5a5a">themselves; the standard deviation of WMAPE measures how far the resulting accuracy</text>
<text xml:space="preserve" text-anchor="start" x="9" y="-100.5" font-family="Cambria" font-size="9.00" fill="#5a5a5a">moves. mWMAPE (%) = mean WMAPE across seeds; sdWMAPE (pp) = its standard deviation;</text>
<text xml:space="preserve" text-anchor="start" x="9" y="-87.25" font-family="Cambria" font-size="9.00" fill="#5a5a5a">medCV (%) = median coefficient of variation of the forecasts.</text>
